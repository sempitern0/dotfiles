# Balanced kernel hardening suitable for developer/admin desktops.
# Unprivileged user namespaces are intentionally NOT disabled: browsers,
# containers and sandboxed desktop applications may require them.

kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.yama.ptrace_scope = 1
kernel.unprivileged_bpf_disabled = 1
fs.suid_dumpable = 0
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
